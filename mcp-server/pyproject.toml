[project]
name = "praetor-mcp"
version = "1.0.0"
description = "Praetor — agentic DAST orchestrator for Burp Suite. MCP server with persistent target memory, KB-driven probes, save-finding pipeline, and 11-agent team."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Tyrus"}]
keywords = ["mcp", "burp-suite", "pentest", "security", "bug-bounty", "praetor", "dast", "agentic-security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "mcp==1.27.0",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "cloakbrowser>=0.3.28",
    # h2: HTTP/2 frame-level control for probe_race_singlepacket / probe_timeless_timing.
    # No httpx http2 extra — we need raw frame access (multi-stream coalesce, send-all-in-one-packet).
    "h2>=4.1.0",
    # defusedxml: XXE/billion-laughs-safe parsing of untrusted scanner output
    # (Nessus / OpenVAS / Burp XML) in import_scan_results.
    "defusedxml>=0.7.1",
    # cvss: real FIRST.org base-score computation (2.0/3.x/4.0) — replaces the
    # in-repo MacroVector band approximation in advisor/_cvss4.py.
    "cvss>=3.4",
    # Support libs for the bundled Python recon tooling and the `uv run` helper env
    # (parsing scanner/HTML output, DNS lookups, image handling). Kali's apt Python
    # ships these globally so imports resolve; a clean macOS uv venv does not — and
    # lxml/Pillow are C extensions needing libxml2/libxslt/libjpeg to build, which
    # setup.sh installs via brew on macOS first. Declared here (not an optional
    # extra) so `uv pip install -e .` installs the full tool surface on every host.
    "lxml>=5.0",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "dnspython>=2.4",
    "beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/TyrusRC/praetor"
Repository = "https://github.com/TyrusRC/praetor"
Issues = "https://github.com/TyrusRC/praetor/issues"

[project.scripts]
praetor-mcp = "praetor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praetor"]

[tool.hatch.build.targets.wheel.force-include]
"src/praetor/data" = "praetor/data"
"src/praetor/tools/analysis/rulesets" = "praetor/tools/analysis/rulesets"
