# OpenAI Codex CLI — merge into ~/.codex/config.toml (or a trusted project's .codex/config.toml).
# Codex uses TOML, and the table key is [mcp_servers.<name>] (underscore), unlike the JSON hosts.

[mcp_servers.praetor]
command = "uvx"
args = ["--from", "git+https://github.com/TyrusRC/praetor.git#subdirectory=mcp-server", "praetor-mcp"]

[mcp_servers.praetor.env]
BURP_API_HOST = "127.0.0.1"
BURP_API_PORT = "8111"
# Tool profile — Codex eager-loads every tool schema at connect, so advertise only the
# lanes you need (server default is 'all'). 'web' is a good default; use network / mobile
# / llm / cloud / core or a comma list. A gated tool is never blocked — run_tool('<tool>',
# {args}) reaches it and auto-enables its lane mid-engagement.
PRAETOR_PROFILE = "web"

# vigil — Praetor's web-scan engine, driven directly over MCP (scan_start,
# scan_status, scan_findings, scan_report, compliance_assess, target_scan, …).
# A Go binary on PATH (go install github.com/TyrusRC/vigil/cmd/vigil@latest), so
# no uvx. Add --state-file <path> to share scan state with a running `vigil web`.
[mcp_servers.vigil]
command = "vigil"
args = ["mcp"]
